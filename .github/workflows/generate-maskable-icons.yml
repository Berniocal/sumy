name: Generate maskable icons

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-maskable-icons.yml'
      - 'icons/icon-192.png'
      - 'icons/icon-512.png'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Generate maskable icons from original icons
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops

          BG = (106, 167, 143, 255)  # theme_color #6aa78f

          def trim_uniform_border(img: Image.Image) -> Image.Image:
              rgba = img.convert('RGBA')
              corner = rgba.getpixel((0, 0))
              bg = Image.new('RGBA', rgba.size, corner)
              diff = ImageChops.difference(rgba, bg)
              # Ignore tiny JPEG/antialiasing differences around a uniform border.
              diff = diff.point(lambda p: 0 if p < 12 else 255)
              bbox = diff.getbbox()
              return rgba.crop(bbox) if bbox else rgba

          for size in (192, 512):
              src = Image.open(f'icons/icon-{size}.png').convert('RGBA')
              artwork = trim_uniform_border(src)

              # Keep the entire original motif inside the maskable safe zone.
              target = round(size * 0.78)
              artwork.thumbnail((target, target), Image.Resampling.LANCZOS)

              canvas = Image.new('RGBA', (size, size), BG)
              x = (size - artwork.width) // 2
              y = (size - artwork.height) // 2
              canvas.alpha_composite(artwork, (x, y))
              canvas.convert('RGB').save(f'icons/maskable-{size}.png', optimize=True)
          PY

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/maskable-192.png icons/maskable-512.png
          if git diff --cached --quiet; then
            echo "No icon changes"
          else
            git commit -m "Vytvořit maskable ikony z původní ikony"
            git push
          fi
