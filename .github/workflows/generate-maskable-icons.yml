name: Generate maskable icons

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-maskable-icons.yml'
      - 'icons/icon-192.png'
      - 'icons/icon-512.png'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Generate edge-to-edge maskable icons from original icons
        run: |
          python - <<'PY'
          from PIL import Image, ImageChops

          def trim_uniform_border(img: Image.Image) -> Image.Image:
              rgba = img.convert('RGBA')
              corner = rgba.getpixel((0, 0))
              bg = Image.new('RGBA', rgba.size, corner)
              diff = ImageChops.difference(rgba, bg)
              diff = diff.point(lambda p: 0 if p < 12 else 255)
              bbox = diff.getbbox()
              return rgba.crop(bbox) if bbox else rgba

          for size in (192, 512):
              src = Image.open(f'icons/icon-{size}.png').convert('RGBA')
              artwork = trim_uniform_border(src)

              # The original artwork itself is enlarged beyond the canvas edges.
              # This removes every visible white/green/blue frame after Android
              # applies its own rounded mask.
              scale = max(size / artwork.width, size / artwork.height) * 1.10
              new_size = (
                  round(artwork.width * scale),
                  round(artwork.height * scale),
              )
              artwork = artwork.resize(new_size, Image.Resampling.LANCZOS)

              left = (artwork.width - size) // 2
              top = (artwork.height - size) // 2
              result = artwork.crop((left, top, left + size, top + size))
              result.convert('RGB').save(
                  f'icons/maskable-{size}.png',
                  optimize=True,
              )
          PY

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/maskable-192.png icons/maskable-512.png
          if git diff --cached --quiet; then
            echo "No icon changes"
          else
            git commit -m "Roztáhnout maskable ikonu až k okrajům"
            git push
          fi
