<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7fb" />
  <link rel="manifest" href="manifest.webmanifest?v=34" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="stylesheet" href="style.css?v=33" />
  <title>Šumy (PWA)</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="dot"></div>
      <div class="title">Šumy</div>
    </div>

    <div class="top-actions">
      <button id="themeBtn" class="iconBtn" type="button" aria-label="Přepnout světlý/tmavý režim">☀️</button>
      <button id="installBtn" class="btn ghost" hidden>Instalovat</button>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="row">
        <button id="soundBtn" class="soundBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
          Bílý šum
          <span class="chev">▾</span>
        </button>

        <button id="toggleBtn" class="btn primary" type="button">▶ Play1</button>
      </div>
      <div class="row">
        <div class="field">
          <label>Časovač</label>
          <button id="timerDisplay" class="timerDisplay" type="button" aria-label="Nastavit časovač">01:30:00</button>
        </div>

        <button id="timerToggle" class="btn" type="button" aria-pressed="false">Zapnout</button>
      </div>

      <div class="small" id="status">Připraveno.</div>
    </section>
  </main>

  <div id="soundModal" class="modal" hidden>
    <div class="modalCard" role="dialog" aria-modal="true" aria-labelledby="soundTitle">
      <div class="modalHead">
        <div id="soundTitle" class="modalTitle">Vyber zvuk</div>
        <button id="soundClose" class="iconBtn" aria-label="Zavřít">✕</button>
      </div>

      <div class="grid">
        <button class="chip" data-sound="white">Bílý šum ⚪️</button>
        <button class="chip" data-sound="pink">Růžový šum 🟣</button>
        <button class="chip" data-sound="brown">Hnědý šum 🟤</button>
        <button class="chip" data-sound="waterfall">Vodopád</button>
        <button class="chip" data-sound="waterfall_real">Vodopády (real)</button>
        <button class="chip" data-sound="sea_real">Moře (real) 🌊</button>
        <button class="chip" data-sound="wind_real">Vítr (real) 💨</button>
        <button class="chip" data-sound="rain_real">Déšť (real)🌧️</button>
        <button class="chip" data-sound="rain">Déšť 🌧️</button>
        <button class="chip" data-sound="wind">Vítr 💨</button>
        <button class="chip" data-sound="fan">Ventilátor 💿</button>
        <button class="chip" data-sound="vacuum">Vysavač</button>
      </div>
    </div>
  </div>

  <div id="timerModal" class="modal" hidden>
    <div class="modalCard timerCard" role="dialog" aria-modal="true" aria-labelledby="timerTitle">
      <div class="timerHead">
        <div id="timerTitle" class="modalTitle">Nastavit čas</div>
        <div class="timerHeadBtns">
          <button id="timerCancel" class="btn" type="button">Zrušit</button>
          <button id="timerOk" class="btn primary" type="button">OK</button>
        </div>
      </div>

      <div class="timerPicker" aria-label="Výběr času">
        <div class="timerTop" aria-hidden="false">
          <button id="timerTopH" class="timerTopNum" type="button" aria-label="Hodiny">00</button>
          <span class="timerTopColon">:</span>
          <button id="timerTopM" class="timerTopNum" type="button" aria-label="Minuty">00</button>
          <span class="timerTopColon">:</span>
          <button id="timerTopS" class="timerTopNum" type="button" aria-label="Sekundy">00</button>
        </div>

        <div class="timerWheels" role="group" aria-label="Rolovací výběr času">
          <div class="wheel" data-unit="h"><div id="wheelH" class="wheelList" tabindex="0" aria-label="Hodiny"></div></div>
          <div class="wheelColon">:</div>
          <div class="wheel" data-unit="m"><div id="wheelM" class="wheelList" tabindex="0" aria-label="Minuty"></div></div>
          <div class="wheelColon">:</div>
          <div class="wheel" data-unit="s"><div id="wheelS" class="wheelList" tabindex="0" aria-label="Sekundy"></div></div>
          <div class="wheelHighlight" aria-hidden="true"></div>
        </div>

        <div class="timerHint">Tip: klepni na čas nahoře a můžeš ho přepsat klávesnicí (HH:MM:SS).</div>
      </div>
    </div>
  </div>

  <script src="app.js?v=33"></script>
  <script src="real-loop-fix.js?v=33"></script>
  <script src="media-session.js?v=33"></script>

  <div id="migrationModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99999;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;">
    <div style="max-width:520px;width:90%;background:#111827;color:white;border-radius:20px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center;">
      <h2 style="margin-top:0;font-size:1.8rem;">Nová verze aplikace je připravena 🚀</h2>
      <p style="line-height:1.6;font-size:1.05rem;">
        Tato původní verze bude postupně ukončena.<br>
        Přesuňte se na novou, rychlejší a aktuální verzi:
      </p>
      <p style="font-size:1.2rem;font-weight:700;color:#60a5fa;">https://bernio.cz/sumy/</p>

      <div style="display:flex;flex-direction:column;gap:12px;margin-top:22px;">
        <button id="goNewApp" style="padding:14px;border:none;border-radius:14px;font-size:1rem;font-weight:700;background:#22c55e;color:white;cursor:pointer;">Otevřít novou verzi</button>
        <button id="laterApp" style="padding:12px;border:none;border-radius:14px;font-size:0.95rem;background:#374151;color:white;cursor:pointer;">Připomenout později</button>
        <button id="closeOldApp" style="padding:12px;border:none;border-radius:14px;font-size:0.95rem;background:#7f1d1d;color:white;cursor:pointer;">Zůstat ve staré verzi</button>
      </div>
    </div>
  </div>

  <script>
  (function(){
    const isOldDomain = location.hostname.includes("berniocal.github.io");
    if (!isOldDomain) return;

    const KEY = "bernio_migration_hide_until";
    const MIGRATED_KEY = "bernio_migrated_to_new_app";
    if (localStorage.getItem(MIGRATED_KEY) === "1") return;

    const hideUntil = Number(localStorage.getItem(KEY) || 0);
    if(Date.now() > hideUntil){
      const modal = document.getElementById("migrationModal");
      if (!modal) return;
      modal.style.display = "flex";

      document.getElementById("goNewApp").onclick = () => {
        localStorage.setItem(MIGRATED_KEY, "1");
        window.location.href = "https://bernio.cz/sumy/";
      };
      document.getElementById("laterApp").onclick = () => {
        localStorage.setItem(KEY, Date.now() + 3*24*60*60*1000);
        modal.style.display = "none";
      };
      document.getElementById("closeOldApp").onclick = () => {
        modal.style.display = "none";
      };
    }
  })();
  </script>
</body>
</html>
